{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="form-card mx-auto"><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Login to your CampusCare account.</p>
<form method="post">
  <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
  <button class="btn btn-primary w-100">Login</button>
</form><p class="mt-3 mb-0 text-center">New student? <a href="{{ url_for('register') }}">Create account</a></p></div>{% endblock %}
